# Verificación continua: formato, linteo, tipos, pruebas y build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: manly
          POSTGRES_PASSWORD: manly
          POSTGRES_DB: manly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://manly:manly@localhost:5432/manly_test
      DATABASE_URL_DIRECTA: postgresql://manly:manly@localhost:5432/manly_test

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar formato
        run: pnpm formato:verificar

      - name: Linteo
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      # Las pruebas de esquema corren sobre PGlite (PostgreSQL en WebAssembly).
      # Esto verifica ademas que las migraciones apliquen sobre un PostgreSQL
      # real y que las semillas sean idempotentes.
      - name: Migraciones
        run: pnpm bd:migrar

      - name: Migraciones son idempotentes
        run: pnpm bd:migrar

      - name: Semillas
        run: pnpm bd:semillas

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

  # Corre aparte y no bloquea: una vulnerabilidad nueva en una dependencia
  # transitiva puede aparecer cualquier martes sin que nadie haya tocado nada, y
  # frenar todos los despliegues por eso hace que se termine ignorando el paso.
  # Lo que sí importa es que quede escrito en el registro de CI y que alguien lo
  # mire. Ver docs/seguridad.md para qué está aceptado y por qué.
  dependencias:
    name: Revisar dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Sólo las que llegan a producción: las de desarrollo no las ejecuta nadie
      # más que nosotros, en nuestras máquinas.
      - name: Auditar dependencias de producción
        run: pnpm audit --prod --audit-level high
